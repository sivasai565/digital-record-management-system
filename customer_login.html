<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Appu Adagaradu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="watermark">APPU ADAGARADU</div>

    <div class="auth-container customer-auth-container">
        <div class="brand-header">
            <h1>Customer Portal</h1>
            <p>Appu Adagaradu • Search products • Order online</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-wrapper">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category if category else 'success' }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('customer_login') }}" class="auth-form" id="customer-login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="customer-password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-target="customer-password" aria-label="Show password">👁</button>
                </div>
            </div>

            <button type="submit" class="primary-btn">Login to Shop</button>

            <div class="flex-row">
                <a href="{{ url_for('customer_register') }}" class="link">New Customer? Register</a>
                <a href="{{ url_for('login') }}" class="link">Shop Owner Login</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
