<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Digital Record Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="watermark">DIGITAL RECORD</div>

    <div class="auth-container">
        <div class="brand-header">
            <h1>Forgot Password</h1>
            <p>Verify your account to reset your password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-wrapper">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category if category else 'error' }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Registered Mobile Number</label>
                <div class="input-wrap">
                    <input type="text" id="mobile" name="mobile" placeholder="Enter registered mobile number" required>
                </div>
            </div>

            <button type="submit" class="primary-btn">Send OTP</button>

            <div class="flex-row">
                <a href="{{ url_for('login') }}" class="link">Back to Login</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
