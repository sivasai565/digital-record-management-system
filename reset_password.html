<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Digital Record Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="watermark">DIGITAL RECORD</div>

    <div class="auth-container">
        <div class="brand-header">
            <h1>Reset Password</h1>
            <p>Create a new secure password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-wrapper">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category if category else 'error' }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="input-wrap">
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                    <button type="button" class="password-toggle" data-target="new_password" aria-label="Show password">👁</button>
                </div>
                <small class="field-hint">Password must contain alphabets and numbers.</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="input-wrap">
                    <input type="password" id="reset_confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                    <button type="button" class="password-toggle" data-target="reset_confirm_password" aria-label="Show password">👁</button>
                </div>
            </div>

            <button type="submit" class="primary-btn">Set New Password</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
